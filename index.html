		<!-- Graphics guards: fixed pixel budget, and a shader guard that drops mutated triangles. -->
		<script>
			(function () {
				// Godot sizes the canvas to CSS pixels times devicePixelRatio. On a hiDPI screen that
				// renders the colour buffer, depth buffer and every internal 3D buffer at 2x-4x the
				// pixel count. The canvas still fills the window here, it just renders at a fixed
				// pixel budget instead of an unlimited density.
				var PIXEL_BUDGET = 2560 * 1440;
				var descriptor = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
				if (!descriptor || !descriptor.get) {
					descriptor = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'devicePixelRatio');
				}
				var nativeRatio = 1;
				try {
					if (descriptor && descriptor.get) nativeRatio = descriptor.get.call(window) || 1;
					else if (descriptor && typeof descriptor.value === 'number') nativeRatio = descriptor.value;
				} catch (error) { /* keep 1 */ }
				try {
					Object.defineProperty(window, 'devicePixelRatio', {
						configurable: true,
						get: function () {
							var cssArea = Math.max(1, window.innerWidth * window.innerHeight);
							var allowed = Math.sqrt(PIXEL_BUDGET / cssArea);
							// Never below 1: CSS pixels stay CSS pixels, so nothing gets blurry.
							return Math.max(1, Math.min(nativeRatio, Math.floor(allowed * 2) / 2));
						},
					});
				} catch (error) { /* keep the browser value */ }

				// A mutated triangle shows up as a face stretched to absurd coordinates. Nothing in a
				// sane scene puts a vertex thousands of screens outside the view, so those vertices are
				// parked behind the eye and their triangle is tagged; every fragment of a tagged
				// triangle is discarded instead of drawn. Real geometry (including terrain planes that
				// legitimately leave the frustum) never comes close to the limit and is untouched.
				var SENTINEL = -12000.0;
				var LIMIT = '1.0e4';
				var ABSURD = '1.0e7';
				var MAIN = /void\s+main\s*\(\s*(?:void\s*)?\)\s*\{/;
				var UV_VAR = /(?:^|\n)[\t ]*(?:varying|out|in)\s+(?:highp\s+|mediump\s+|lowp\s+)?(vec[234])\s+(\w*uv\w*)\s*;/gi;

				// Replace comment characters with spaces so every index still matches the original.
				function blankComments(source) {
					return source
						.replace(/\/\*[\s\S]*?\*\//g, function (m) { return m.replace(/[^\n]/g, ' '); })
						.replace(/\/\/[^\n]*/g, function (m) { return m.replace(/[^\n]/g, ' '); });
				}

				function matchBrace(source, openIndex) {
					var depth = 0;
					for (var i = openIndex; i < source.length; i++) {
						var ch = source.charAt(i);
						if (ch === '{') depth++;
						else if (ch === '}') {
							depth--;
							if (depth === 0) return i;
						}
					}
					return -1;
				}

				function insertLines(source, index, block) {
					var lineStart = source.lastIndexOf('\n', index - 1) + 1;
					var indent = source.slice(lineStart, index).match(/^[\t ]*/)[0];
					var lines = block.split('\n');
					for (var i = 1; i < lines.length; i++) lines[i] = indent + lines[i];
					return source.slice(0, index) + lines.join('\n') + source.slice(index);
				}

				function uvVarying(clean) {
					var found = clean.match(UV_VAR) || [];
					var best = null;
					for (var i = 0; i < found.length; i++) {
						var decl = found[i].match(/(vec[234])\s+(\w+)\s*;\s*$/);
						if (!decl) continue;
						var entry = { type: decl[1], name: decl[2] };
						// Both stages must pick the same name, so prefer the one Godot uses for UVs.
						if (entry.name === 'uv_interp') return entry;
						if (!best) best = entry;
					}
					return best;
				}

				function taggedWrite(uv) {
					if (!uv) return '';
					return uv.type === 'vec2'
						? uv.name + ' = vec2(' + SENTINEL.toFixed(1) + ');'
						: uv.name + '.xy = vec2(' + SENTINEL.toFixed(1) + ');';
				}

				function patchVertex(source) {
					if (source.indexOf('1.0e7') >= 0) return source;
					var clean = blankComments(source);
					var head = clean.match(MAIN);
					if (!head) return source;
					var open = head.index + head[0].length - 1;
					var close = matchBrace(clean, open);
					if (close < 0) return source;
					var uv = uvVarying(clean);
					var tag = taggedWrite(uv);
					// All in one statement, so it is valid in a GLSL ES 1.00 block as well as 3.00. The
					// absolute bound catches NaN, infinities and absurd coordinates; the ratio bound only
					// applies well in front of the eye, because a vertex hugging the near plane has a
					// legitimate huge |x| / |w| ratio and must never be dropped.
					var block = [
						'if (!(abs(gl_Position.x) < ' + ABSURD + ') || !(abs(gl_Position.y) < ' + ABSURD + ')',
						'	|| !(abs(gl_Position.z) < ' + ABSURD + ') || !(abs(gl_Position.w) < ' + ABSURD + ')',
						'	|| (abs(gl_Position.w) > 1.0 && (abs(gl_Position.x) > ' + LIMIT + ' * abs(gl_Position.w)',
						'		|| abs(gl_Position.y) > ' + LIMIT + ' * abs(gl_Position.w)))) {',
						'	gl_Position = vec4(0.0, 0.0, -3.0, 1.0);',
					];
					if (tag) block.push('\t' + tag);
					block.push('}');
					return insertLines(source, close, block.join('\n') + '\n');
				}

				function patchFragment(source) {
					var clean = blankComments(source);
					var head = clean.match(MAIN);
					if (!head) return source;
					var uv = uvVarying(clean);
					if (!uv) return source;
					var open = head.index + head[0].length - 1;
					return insertLines(source, open + 1, 'if (' + uv.name + '.x < ' + SENTINEL.toFixed(1) + ') discard;\n');
				}

				function install(Context) {
					if (!Context || !Context.prototype || Context.prototype.__ftnGuard) return;
					Context.prototype.__ftnGuard = true;
					var types = typeof WeakMap === 'function' ? new WeakMap() : null;
					if (!types) return;
					var createShader = Context.prototype.createShader;
					var shaderSource = Context.prototype.shaderSource;
					Context.prototype.createShader = function (type) {
						var shader = createShader.call(this, type);
						try { types.set(shader, type); } catch (error) { /* ignore */ }
						return shader;
					};
					Context.prototype.shaderSource = function (shader, source) {
						var text = Array.isArray(source) ? source.join('\n') : String(source);
						try {
							var type = types.get(shader);
							// Only touch a shader whose type is known: guessing would inject a discard
							// into a vertex shader and break the compile.
							if (type === this.VERTEX_SHADER) text = patchVertex(text);
							else if (type === this.FRAGMENT_SHADER) text = patchFragment(text);
							if (!window.__ftnGuardLogged && text !== (Array.isArray(source) ? source.join('\n') : String(source))) {
								window.__ftnGuardLogged = true;
								console.info('[findtheneedle] triangle guard active');
							}
						} catch (error) { /* ship the original source untouched */ }
						return shaderSource.call(this, shader, text);
					};
				}
				install(window.WebGL2RenderingContext);
				install(window.WebGLRenderingContext);
			})();
		</script>

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

		threads: GODOT_THREADS_ENABLED,
	});

			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();

			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);

			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';

			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
