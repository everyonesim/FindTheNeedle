		<!-- Graphics pressure guards: keep the pixel budget and the GPU failure mode under control. -->
		<script>
			(function () {
				// Godot sizes the canvas to CSS pixels times devicePixelRatio. On a hiDPI screen that
				// renders the colour buffer, depth buffer and every internal 3D buffer at 2x-4x the
				// pixel count. The canvas still fills the window here, it just renders at a fixed
				// pixel budget instead of an unlimited density.
				var PIXEL_BUDGET = 2560 * 1440;
				var descriptor = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
				if (!descriptor || !descriptor.get) {
					descriptor = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'devicePixelRatio');
				}
				var nativeRatio = 1;
				try {
					if (descriptor && descriptor.get) nativeRatio = descriptor.get.call(window) || 1;
					else if (descriptor && typeof descriptor.value === 'number') nativeRatio = descriptor.value;
				} catch (error) { /* keep 1 */ }
				try {
					Object.defineProperty(window, 'devicePixelRatio', {
						configurable: true,
						get: function () {
							var cssArea = Math.max(1, window.innerWidth * window.innerHeight);
							var allowed = Math.sqrt(PIXEL_BUDGET / cssArea);
							// Never below 1: CSS pixels stay CSS pixels, so nothing gets blurry.
							return Math.max(1, Math.min(nativeRatio, Math.floor(allowed * 2) / 2));
						},
					});
				} catch (error) { /* keep the browser value */ }

				// A reset GPU drops the WebGL context. The engine keeps drawing from buffers that no
				// longer exist, which is what black or coloured faces stretched across the scene
				// actually looks like. Catch it and offer a clean restart instead.
				function showGameLost() {
					if (document.getElementById('graphics-lost')) return;
					var box = document.createElement('div');
					box.id = 'graphics-lost';
					box.setAttribute('role', 'alert');
					box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;'
						+ 'align-items:center;justify-content:center;gap:0.85rem;padding:2rem;box-sizing:border-box;'
						+ 'text-align:center;background:#0f1114;color:#e8ebf0;font-family:"Noto Sans",Arial,sans-serif;';
					var title = document.createElement('div');
					title.textContent = 'The graphics device reset';
					title.style.cssText = 'font-size:1.05rem;font-weight:600;';
					var body = document.createElement('div');
					body.textContent = 'The browser dropped the game surface, so the scene can no longer be drawn. Reload to keep playing.';
					body.style.cssText = 'font-size:0.9rem;line-height:1.5;color:#8b93a1;max-width:30rem;';
					var button = document.createElement('button');
					button.textContent = 'Reload';
					button.style.cssText = 'margin-top:0.5rem;padding:0.6rem 1.5rem;font:inherit;font-size:0.9rem;'
						+ 'color:#0f1114;background:#cfd6e2;border:0;border-radius:0.4rem;cursor:pointer;';
					button.addEventListener('click', function () { location.reload(); });
					box.appendChild(title);
					box.appendChild(body);
					box.appendChild(button);
					document.body.appendChild(box);
				}
				window.addEventListener('webglcontextlost', showGameLost, true);
			})();
		</script>

	function setStatusMode(mode) {

			statusNotice.removeChild(statusNotice.lastChild);

		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
